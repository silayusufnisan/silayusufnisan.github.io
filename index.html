<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A2130">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Sude Sıla &amp; Recep Yusuf | Anılarımız</title>
  <meta name="description" content="Nişanımızda çektiğiniz fotoğraf ve videoları bizimle paylaşın.">
  <meta property="og:title" content="Sude Sıla &amp; Recep Yusuf | Anılarımız">
  <meta property="og:description" content="Nişanımızda çektiğiniz fotoğraf ve videoları bizimle paylaşın.">
  <meta property="og:image" content="assets/img/kapak.jpg">
  <link rel="icon" href="assets/img/simge.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/simge-180.png">
  <link rel="preload" href="assets/fonts/fraunces-latin-full-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/img/kapak.jpg" as="image">
  <link rel="stylesheet" href="assets/css/ortak.css?v=1">
  <link rel="stylesheet" href="assets/css/uygulama.css?v=1">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-galeri" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.8 17.5l5-4.6 3.6 3.2 2.6-2.3 5.2 4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-kamera" viewBox="0 0 24 24"><path d="M4.5 7.5h3l1.6-2.2h5.8l1.6 2.2h3a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18V9a1.5 1.5 0 0 1 1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13.2" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-mikrofon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-oynat" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-durdur" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="4" height="13" rx="1.2" fill="currentColor"/><rect x="13.5" y="5.5" width="4" height="13" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-kare" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></symbol>
    <symbol id="i-sil" viewBox="0 0 24 24"><path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.9 11.2A2 2 0 0 0 9.4 20h5.2a2 2 0 0 0 2-1.8L17.5 7M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-carpi" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-tamam" viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2L18.5 7.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-geri" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-tekrar" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 10.5l5-3v9l-5-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-dal" viewBox="0 0 24 24"><path d="M4 20C9 15 13 10 20 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M9 14.6c-2.6-.2-4.2-1.6-4.6-3.7 2.3-.1 4.1 1.2 4.6 3.7zM12.3 11c.2-2.6 1.6-4.2 3.7-4.6.1 2.3-1.2 4.1-3.7 4.6zM14 9.2c-2.4-.6-3.6-2.2-3.7-4.3 2.2.3 3.6 1.9 3.7 4.3zM10.4 13.3c.6 2.5-.2 4.4-2.1 5.4-.7-2.2.1-4.2 2.1-5.4z" fill="currentColor"/></symbol>
    <symbol id="i-bilgi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5.2M12 7.8v.3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<main id="uygulama">

  <!-- ============ KARŞILAMA ============ -->
  <section class="ekran ekran--gece kapak" id="ekran-kapak" data-ekran="kapak">
    <button class="dil-dugmesi" type="button" data-dil-degistir aria-label="Switch to English">EN</button>

    <div class="kapak__ic">
      <figure class="kemer" id="kemer">
        <div class="kemer__cerceve">
          <img id="kapakFoto" alt="" decoding="async" fetchpriority="high">
          <div class="kemer__monogram serif" id="monogram" hidden></div>
        </div>
        <svg class="dal" viewBox="0 0 220 170" aria-hidden="true">
          <path class="dal__sap" d="M6 164 C 40 150, 70 128, 98 104 S 152 52, 210 12"/>
          <g class="dal__yapraklar">
            <path style="--i:0" d="M34 151 c -4 -14 3 -25 17 -29 c 2 14 -5 25 -17 29z"/>
            <path style="--i:1" d="M52 142 c 12 6 25 3 32 -8 c -12 -7 -25 -4 -32 8z"/>
            <path style="--i:2" d="M74 124 c -3 -15 5 -26 19 -29 c 1 15 -7 26 -19 29z"/>
            <path style="--i:3" d="M96 106 c 13 5 26 0 31 -12 c -13 -5 -25 0 -31 12z"/>
            <path style="--i:4" d="M118 84 c -2 -15 7 -25 21 -27 c 0 15 -8 25 -21 27z"/>
            <path style="--i:5" d="M140 64 c 13 4 25 -2 29 -14 c -13 -4 -25 2 -29 14z"/>
            <path style="--i:6" d="M162 44 c -1 -14 8 -23 21 -24 c -1 14 -9 23 -21 24z"/>
            <path style="--i:7" d="M186 26 c 11 3 21 -2 24 -12 c -11 -3 -21 2 -24 12z"/>
          </g>
          <circle class="dal__zeytin" cx="61" cy="129" r="4.2"/>
          <circle class="dal__zeytin" cx="131" cy="72" r="3.8"/>
        </svg>
      </figure>

      <p class="kapak__ust"></p>
      <h1 class="isimler serif">
        <span class="isimler__bir" id="isim1"></span>
        <span class="isimler__ve" aria-label="ve">&amp;</span>
        <span class="isimler__iki" id="isim2"></span>
      </h1>
      <p class="kapak__tarih">
        <span id="tarihYazi"></span>
        <span class="kapak__saat" id="saatYazi"></span>
      </p>
      <p class="kapak__durum" id="durumYazi" hidden></p>

      <div class="kapak__eylem">
        <p class="kapak__selam" id="selam" hidden></p>
        <p class="kapak__uyari" id="kapakUyari" hidden></p>
        <button class="dugme dugme--leylak dugme--tam" type="button" id="basla">
          <svg><use href="#i-galeri"/></svg><span data-i18n="paylasDugme"></span>
        </button>
        <div class="kapak__baglantilar">
          <button class="dugme dugme--metin" type="button" data-git="benimkiler" id="kapakBenimkiler" hidden></button>
          <button class="dugme dugme--metin" type="button" id="degistirIsim" hidden></button>
        </div>
      </div>
    </div>

    <p class="kapak__dipnot" data-i18n="gizlilik"></p>
  </section>

  <!-- ============ PAYLAŞ ============ -->
  <section class="ekran ekran--kagit" id="ekran-paylas" data-ekran="paylas" hidden>
    <header class="ust-serit">
      <button class="ust-serit__geri" type="button" data-geri aria-label="Geri" data-i18n-aria="geri"><svg><use href="#i-geri"/></svg></button>
      <span class="ust-serit__isim serif" data-cift></span>
      <button class="dil-dugmesi dil-dugmesi--koyu" type="button" data-dil-degistir>EN</button>
    </header>

    <div class="icerik">
      <h2 class="baslik serif" id="paylasBaslik"></h2>
      <p class="aciklama" id="paylasAciklama"></p>

      <div class="secim">
        <label class="secim__kutu secim__kutu--koyu" for="galeriGirdi">
          <svg><use href="#i-galeri"/></svg>
          <span class="secim__ad" data-i18n="galeridenSec"></span>
          <span class="secim__not" data-i18n="galeriNot"></span>
          <input class="gorunmez" type="file" id="galeriGirdi" multiple accept="image/*,video/*">
        </label>
        <label class="secim__kutu" for="kameraGirdi">
          <svg><use href="#i-kamera"/></svg>
          <span class="secim__ad" data-i18n="simdiCek"></span>
          <span class="secim__not" data-i18n="kameraNot"></span>
          <input class="gorunmez" type="file" id="kameraGirdi" accept="image/*,video/*" capture="environment">
        </label>
      </div>

      <div id="reddedilenler" class="reddedilenler" aria-live="polite"></div>

      <div class="secilenler" id="secilenler" hidden>
        <div class="secilenler__ust">
          <h3 class="secilenler__baslik" id="secilenSayisi"></h3>
          <button class="dugme dugme--metin" type="button" id="hepsiniKaldir" data-i18n="temizle"></button>
        </div>
        <ul class="izgara" id="secilenIzgara"></ul>
      </div>

      <section class="defter" aria-labelledby="defterBaslik">
        <svg class="defter__dal" aria-hidden="true"><use href="#i-dal"/></svg>
        <h3 class="defter__baslik serif" id="defterBaslik" data-i18n="aniDefteri"></h3>
        <p class="defter__aciklama" id="defterAciklama"></p>
        <label class="gorunmez" for="notGirdi" data-i18n="notEtiket"></label>
        <textarea class="girdi" id="notGirdi" maxlength="1000" rows="3"></textarea>
        <div class="defter__sayac" id="notSayac" aria-hidden="true">0 / 1000</div>

        <button class="dugme dugme--cizgi dugme--tam" type="button" id="sesAc">
          <svg><use href="#i-mikrofon"/></svg><span data-i18n="sesKaydet"></span>
        </button>
        <div class="ses-ek" id="sesEk" hidden>
          <button class="ses-ek__oynat" type="button" id="sesEkOynat" aria-label="Dinle"><svg><use href="#i-oynat"/></svg></button>
          <div class="ses-ek__bilgi">
            <span class="ses-ek__ad" data-i18n="sesliMesajiniz"></span>
            <span class="ses-ek__sure" id="sesEkSure"></span>
          </div>
          <button class="ses-ek__sil" type="button" id="sesEkSil" aria-label="Sil" data-i18n-aria="sil"><svg><use href="#i-sil"/></svg></button>
        </div>
      </section>
    </div>

    <div class="alt-cubuk">
      <p class="alt-cubuk__ozet" id="gonderOzet" aria-live="polite"></p>
      <button class="dugme dugme--ana dugme--tam" type="button" id="gonder" disabled>
        <span data-i18n="gonder"></span>
      </button>
    </div>
  </section>

  <!-- ============ YÜKLENİYOR ============ -->
  <section class="ekran ekran--kagit" id="ekran-yukleme" data-ekran="yukleme" hidden>
    <header class="ust-serit ust-serit--ortali">
      <span class="ust-serit__isim serif" data-cift></span>
    </header>
    <div class="icerik">
      <h2 class="baslik serif" id="yuklemeBaslik"></h2>
      <p class="aciklama" id="yuklemeAlt"></p>

      <div class="genel" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="genelCubuk">
        <div class="genel__ray"><span class="genel__dolu" id="genelDolu"></span></div>
        <div class="genel__yazi"><span id="genelYuzde">%0</span><span id="genelSayi"></span></div>
      </div>

      <div class="serit-uyari" id="cevrimdisi" hidden data-i18n="cevrimdisi"></div>

      <ul class="liste" id="yuklemeListesi" aria-live="off"></ul>
    </div>
    <div class="alt-cubuk" id="yuklemeEylem" hidden>
      <button class="dugme dugme--ana dugme--tam" type="button" id="hepsiniTekrar">
        <svg><use href="#i-tekrar"/></svg><span data-i18n="hepsiniTekrar"></span>
      </button>
      <button class="dugme dugme--metin dugme--tam" type="button" id="bunlarsizBitir" data-i18n="bunlarsizBitir"></button>
    </div>
  </section>

  <!-- ============ TEŞEKKÜRLER ============ -->
  <section class="ekran ekran--gece tesekkur" id="ekran-tesekkur" data-ekran="tesekkur" hidden>
    <canvas class="konfeti" id="konfeti" aria-hidden="true"></canvas>
    <div class="tesekkur__ic">
      <div class="tesekkur__isaret" aria-hidden="true"><svg><use href="#i-tamam"/></svg></div>
      <h2 class="tesekkur__baslik serif" id="tesekkurBaslik"></h2>
      <p class="tesekkur__yazi" id="tesekkurYazi"></p>
      <button class="dugme dugme--leylak dugme--tam" type="button" id="dahaFazla">
        <svg><use href="#i-galeri"/></svg><span data-i18n="dahaFazla"></span>
      </button>
      <button class="dugme dugme--metin" type="button" data-git="benimkiler" data-i18n="yuklediklerimiGor"></button>
    </div>
  </section>

  <!-- ============ YÜKLEDİKLERİM ============ -->
  <section class="ekran ekran--kagit" id="ekran-benimkiler" data-ekran="benimkiler" hidden>
    <header class="ust-serit">
      <button class="ust-serit__geri" type="button" data-geri aria-label="Geri" data-i18n-aria="geri"><svg><use href="#i-geri"/></svg></button>
      <span class="ust-serit__isim serif" data-cift></span>
      <button class="dil-dugmesi dil-dugmesi--koyu" type="button" data-dil-degistir>EN</button>
    </header>
    <div class="icerik">
      <h2 class="baslik serif" data-i18n="yuklediklerim"></h2>
      <p class="aciklama" id="benimAciklama"></p>
      <ul class="izgara izgara--benim" id="benimIzgara"></ul>
      <div id="benimNotlar" class="notlar"></div>
      <div class="bos" id="benimBos" hidden>
        <svg class="bos__dal" aria-hidden="true"><use href="#i-dal"/></svg>
        <p data-i18n="bosYazi"></p>
        <button class="dugme dugme--ana" type="button" id="bosPaylas"><span data-i18n="ilkAni"></span></button>
      </div>
    </div>
  </section>
</main>

<!-- ============ İSİM PERDESİ ============ -->
<div class="perde" id="isimPerde" role="dialog" aria-modal="true" aria-labelledby="isimBaslik" hidden>
  <div class="perde__arka" data-perde-kapat></div>
  <form class="perde__kutu" id="isimFormu" novalidate>
    <span class="perde__tutamak" aria-hidden="true"></span>
    <h2 class="perde__baslik serif" id="isimBaslik" data-i18n="siziTaniyalim"></h2>
    <p class="perde__aciklama" id="isimAciklama"></p>
    <label class="alan">
      <span class="alan__etiket" data-i18n="adSoyad"></span>
      <input class="girdi" id="adGirdi" name="ad" type="text" autocomplete="name" autocapitalize="words" enterkeyhint="next" maxlength="80" required>
      <span class="alan__hata" id="adHata" hidden></span>
    </label>
    <label class="alan">
      <span class="alan__etiket"><span data-i18n="telefon"></span> <small data-i18n="istegeBagli"></small></span>
      <input class="girdi" id="telGirdi" name="tel" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="done" maxlength="20" placeholder="05xx xxx xx xx">
    </label>
    <button class="dugme dugme--ana dugme--tam" type="submit"><span data-i18n="devam"></span></button>
    <p class="perde__not" data-i18n="isimNot"></p>
  </form>
</div>

<!-- ============ SESLİ MESAJ PERDESİ ============ -->
<div class="perde" id="sesPerde" role="dialog" aria-modal="true" aria-labelledby="sesBaslik" hidden>
  <div class="perde__arka" data-perde-kapat></div>
  <div class="perde__kutu perde__kutu--ses">
    <span class="perde__tutamak" aria-hidden="true"></span>
    <h2 class="perde__baslik serif" id="sesBaslik" data-i18n="sesliMesaj"></h2>
    <p class="perde__aciklama" id="sesAciklama"></p>
    <canvas class="ses__dalga" id="sesDalga" aria-hidden="true"></canvas>
    <p class="ses__sure" id="sesSure" aria-live="polite">0:00</p>
    <div class="ses__dugmeler" id="sesDurumHazir">
      <button class="ses__kayit" type="button" id="sesBaslat" aria-label="Kaydı başlat" data-i18n-aria="kaydiBaslat"><span></span></button>
    </div>
    <div class="ses__dugmeler" id="sesDurumKayit" hidden>
      <button class="ses__kayit ses__kayit--aktif" type="button" id="sesBitir" aria-label="Kaydı bitir" data-i18n-aria="kaydiBitir"><svg><use href="#i-kare"/></svg></button>
    </div>
    <div class="ses__bitti" id="sesDurumBitti" hidden>
      <button class="dugme dugme--cizgi" type="button" id="sesDinle"><svg><use href="#i-oynat"/></svg><span data-i18n="dinle"></span></button>
      <button class="dugme dugme--cizgi" type="button" id="sesYeniden"><svg><use href="#i-tekrar"/></svg><span data-i18n="yenidenKaydet"></span></button>
      <button class="dugme dugme--ana dugme--tam" type="button" id="sesEkle"><svg><use href="#i-tamam"/></svg><span data-i18n="mesajiEkle"></span></button>
    </div>
    <button class="dugme dugme--metin perde__vazgec" type="button" data-perde-kapat data-i18n="vazgec"></button>
  </div>
</div>

<div class="bildirimler" id="bildirimler" aria-live="assertive"></div>

<script src="ayarlar.js?v=1"></script>
<script src="assets/js/api.js?v=1"></script>
<script src="assets/js/yukleyici.js?v=1"></script>
<script src="assets/js/uygulama.js?v=1"></script>
</body>
</html>
